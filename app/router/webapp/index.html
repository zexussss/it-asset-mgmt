<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Asset Management</title>
  <style>
:root {
  --sapBrandColor: #4db1ff;
  --sapTextColor: #fafafa;
  --sapTileBackground: #2b313a;
  --sapBackgroundColor: #12171c;
  --sapBorderColor: #3a4552;
  --sapLinkColor: #4db1ff;
  --sapHoverBackground: #3a4552;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "72", "72full", Arial, Helvetica, sans-serif;
  background-color: var(--sapBackgroundColor);
  color: var(--sapTextColor);
  padding: 2rem;
}
h1 { font-size: 1.5rem; font-weight: normal; margin-bottom: .25rem; color: var(--sapTextColor); }
.subtitle { color: #9aa7b2; margin-bottom: 1.5rem; font-size: .9rem; }
.top-bar { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .25rem; }
.top-bar a.logout { color: var(--sapLinkColor); text-decoration: none; font-size: .85rem; }
.top-bar a.logout:hover { text-decoration: underline; }
.services-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
.services-grid.single { grid-template-columns: minmax(260px, 420px); }
.service-card {
  background-color: var(--sapTileBackground);
  border: 1px solid var(--sapBorderColor);
  border-radius: 4px;
  padding: 1rem;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
}
.service-card h2 {
  font-size: 1.1rem; font-weight: 600; margin-bottom: .75rem;
  color: var(--sapBrandColor); border-bottom: 1px solid var(--sapBorderColor); padding-bottom: .5rem;
}
.service-card ul { list-style: none; }
.service-card li { margin-bottom: .5rem; }
.service-card a {
  display: block; padding: .5rem .75rem; text-decoration: none;
  color: var(--sapLinkColor); border-radius: 3px; transition: background-color .2s;
}
.service-card a:hover { background-color: var(--sapHoverBackground); }
.status-message { color: #9aa7b2; margin-top: 2rem; }
@media (max-width: 900px) { .services-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .services-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Asset Management</h1>
  <p class="status-message" id="status">Определяем вашу роль...</p>

  <script>
    const ROLE_PAGES = [
      ['Admin', 'admin.html'],
      ['RepairTechnician', 'repair.html'],
      ['AssetManager', 'inventory.html'],
      ['Employee', 'employee.html']
    ];

    fetch('/user-api/currentUser')
      .then(res => {
        if (!res.ok) throw new Error('not authenticated');
        return res.json();
      })
      .then(user => {
        const scopes = user.scopes || [];
        const hasRole = (role) => scopes.some(s => s.endsWith('.' + role));
        const match = ROLE_PAGES.find(([role]) => hasRole(role));

        if (match) {
          window.location.replace(match[1]);
        } else {
          document.getElementById('status').textContent =
            'You logged in, but you have not been assigned any roles (Admin / RepairTechnician / AssetManager / Employee). Please contact your administrator to assign a Role Collection.';
        }
      })
      .catch(() => {
        document.getElementById('status').textContent =
          'Failed to determine the user. Please try reloading the page.';
      });
  </script>
</body>
</html>
