<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Asset Management — Employee Portal</title>


  <script>
    (function () {
      var sTheme = "sap_horizon_dark";
      try {
        sTheme = window.localStorage.getItem("itam.theme") || sTheme;
      } catch (e) { /* private mode */ }
      window["sap-ui-config"] = window["sap-ui-config"] || {};
      window["sap-ui-config"].theme = sTheme;
      document.documentElement.setAttribute(
        "data-itam-theme", sTheme === "sap_horizon" ? "light" : "dark");
    }());
  </script>

  <script
    id="sap-ui-bootstrap"
    src="https://ui5.sap.com/1.120.21/resources/sap-ui-core.js"
    data-sap-ui-resourceroots='{ "employee": "./", "common": "./common/" }'
    data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true"
    data-sap-ui-frameOptions="trusted">
  </script>
</head>
<body class="sapUiBody" id="content">
  <div data-sap-ui-component data-name="employee" data-id="container"
       data-settings='{"id":"employee"}' data-handle-validation="true"></div>
</body>
</html>
